server:
  address: ${TESTPAY_SERVER_ADDRESS:127.0.0.1}
  port: ${TESTPAY_SERVER_PORT:8092}

spring:
  application:
    name: gateway-pay-test-api
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

testpay:
  gateway-base-url: ${TESTPAY_GATEWAY_BASE_URL:https://api.linsy.online}
  app-id: ${TESTPAY_GATEWAY_APP_ID}
  app-secret: ${TESTPAY_GATEWAY_APP_SECRET}
  return-url: ${TESTPAY_RETURN_URL:https://testpay.linsy.online/pay-result.html}
  business-notify-url: ${TESTPAY_BUSINESS_NOTIFY_URL:https://testpay.linsy.online/api/testpay/notify}
