# Copy to /etc/nginx/conf.d/alipay.conf.
# Certificate paths assume files are copied to /etc/nginx/ssl/<domain>/.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream mall_api {
    server 127.0.0.1:8080;
}

upstream merchant_api {
    server 127.0.0.1:8081;
}

upstream gateway_api {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    server_name mall.linsy.online merchant.linsy.online admin.linsy.online api.linsy.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mall.linsy.online;

    ssl_certificate     /etc/nginx/ssl/mall.linsy.online/mall.linsy.online_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/mall.linsy.online/mall.linsy.online.key;

    root /var/www/alipay/mall;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name merchant.linsy.online;

    ssl_certificate     /etc/nginx/ssl/merchant.linsy.online/merchant.linsy.online_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/merchant.linsy.online/merchant.linsy.online.key;

    root /var/www/alipay/merchant;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.linsy.online;

    ssl_certificate     /etc/nginx/ssl/admin.linsy.online/admin.linsy.online_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.linsy.online/admin.linsy.online.key;

    root /var/www/alipay/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name api.linsy.online;

    ssl_certificate     /etc/nginx/ssl/api.linsy.online/api.linsy.online_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/api.linsy.online/api.linsy.online.key;

    client_max_body_size 10m;

    location /api/mall/ {
        proxy_pass http://mall_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/merchant/ {
        proxy_pass http://merchant_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/admin/ {
        proxy_pass http://merchant_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/gateway/ {
        proxy_pass http://gateway_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/ {
        alias /var/www/alipay/uploads/;
        access_log off;
        expires 30d;
    }
}
