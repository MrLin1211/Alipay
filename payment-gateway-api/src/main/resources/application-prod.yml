server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PAYMENT_GATEWAY_PORT:8090}

spring:
  datasource:
    url: ${GATEWAY_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/payment_gateway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${GATEWAY_DATASOURCE_USERNAME:alipay_user}
    password: ${GATEWAY_DATASOURCE_PASSWORD}

gateway:
  client:
    default-username: ${GATEWAY_CLIENT_USERNAME:client}
    default-password: ${GATEWAY_CLIENT_PASSWORD:client123456}
    default-name: ${GATEWAY_CLIENT_NAME:演示接入方}
  demo-app:
    enabled: ${GATEWAY_DEMO_APP_ENABLED:false}
  zhenbaoge:
    host: ${ZHENBAOGE_HOST:https://pay.zhenbaoge.com}
    external-id: ${ZHENBAOGE_EXTERNAL_ID}
    md5-key: ${ZHENBAOGE_MD5_KEY}
    aes-key: ${ZHENBAOGE_AES_KEY}
    notify-url: ${ZHENBAOGE_NOTIFY_URL}
    enabled: ${ZHENBAOGE_ENABLED:true}
