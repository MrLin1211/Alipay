server:
  port: 8081

spring:
  application:
    name: merchant-api
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/alipay_pay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:alipay_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
mallhome:
  gateway-datasource:
    url: ${GATEWAY_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/payment_gateway?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${GATEWAY_DATASOURCE_USERNAME:alipay_user}
    password: ${GATEWAY_DATASOURCE_PASSWORD:}
    driver-class-name: ${GATEWAY_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  pay:
    host: ${MALLHOME_PAY_HOST:https://mallhome.jiaoyie.com}
    md5-key: ${MALLHOME_MD5_KEY:}
    aes-key: ${MALLHOME_AES_KEY:}
    external-id: ${MALLHOME_EXTERNAL_ID:}
    notify-url: ${MALLHOME_NOTIFY_URL:https://www.example.com/pay/notify}
    return-url: ${MALLHOME_RETURN_URL:https://www.example.com/pay/success}
    default-pay-method-type: ${MALLHOME_PAY_METHOD_TYPE:ALIPAY_CN}
    gateway-host: ${PAYMENT_GATEWAY_HOST:http://127.0.0.1:8090}
    gateway-app-id: ${PAYMENT_GATEWAY_APP_ID:biz-demo}
    gateway-app-secret: ${PAYMENT_GATEWAY_APP_SECRET:demo-secret-change-me}
