server {
    listen 80;
    listen [::]:80;
    server_name admin.chengxinkeji.xin client.chengxinkeji.xin testpay.chengxinkeji.xin api.chengxinkeji.xin;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.chengxinkeji.xin;

    root /www/wwwroot/alipay-gateway-chengxinkeji/admin;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/admin.chengxinkeji.xin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/admin.chengxinkeji.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AlipayGatewaySSL:10m;
    ssl_session_timeout 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name client.chengxinkeji.xin;

    root /www/wwwroot/alipay-gateway-chengxinkeji/client;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/client.chengxinkeji.xin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/client.chengxinkeji.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AlipayGatewaySSL:10m;
    ssl_session_timeout 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
