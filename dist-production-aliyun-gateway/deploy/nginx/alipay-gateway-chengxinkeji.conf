    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name testpay.chengxinkeji.xin;

    root /www/wwwroot/alipay-gateway-chengxinkeji/testpay;
    index index.html;

    ssl_certificate /www/server/panel/vhost/cert/testpay.chengxinkeji.xin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/testpay.chengxinkeji.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AlipayGatewaySSL:10m;
    ssl_session_timeout 10m;

    location /api/testpay/ {
        proxy_pass http://127.0.0.1:18091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.chengxinkeji.xin;

    ssl_certificate /www/server/panel/vhost/cert/api.chengxinkeji.xin/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.chengxinkeji.xin/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AlipayGatewaySSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    location /api/gateway/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
