server:
  port: 8080

spring:
  application:
    name: mallhome-pay-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/alipay_pay?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:alipay_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
mallhome:
  pay:
    host: ${MALLHOME_PAY_HOST:https://mallhome.jiaoyie.com}
    md5-key: ${MALLHOME_MD5_KEY:}
    aes-key: ${MALLHOME_AES_KEY:}
    external-id: ${MALLHOME_EXTERNAL_ID:}
    notify-url: ${MALLHOME_NOTIFY_URL:https://www.example.com/pay/notify}
    return-url: ${MALLHOME_RETURN_URL:https://www.example.com/pay/success}
    default-pay-method-type: ${MALLHOME_PAY_METHOD_TYPE:ALIPAY_CN}
