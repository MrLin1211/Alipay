server {
    listen 80;
    listen [::]:80;
    server_name mall.linsy.online app.linsy.online admin.linsy.online client.linsy.online testpay.linsy.online api.linsy.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.linsy.online;

    root /var/www/alipay/app;
    index index.html;

    ssl_certificate /etc/nginx/ssl/app.linsy.online/app.linsy.online_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/app.linsy.online/app.linsy.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

